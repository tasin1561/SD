# Security headers for the subdomains Nginx serves directly.
#
# ── WHO NEEDS THIS ───────────────────────────────────────────────────
# apps/admin, apps/seller and apps/track set their own headers in Next
# (`packages/config/security-headers.mjs`) and their own per-request
# nonce CSP in middleware, so Nginx must NOT add a second
# Content-Security-Policy for them — a browser enforces every CSP header
# it receives, and the intersection of a nonce policy and a static one
# blocks Next's own scripts.
#
# apps/marketing is different: it is `output: 'export'`, a pile of static
# files with no Node process, so `headers()` never runs. Its headers can
# only come from whatever serves the files. That is what this file is
# for.
#
# ── INSTALL ──────────────────────────────────────────────────────────
#   scp docs/nginx-security-headers.conf root@droplet:/etc/nginx/snippets/
#   # then inside the skydrop.online server block:
#   include /etc/nginx/snippets/nginx-security-headers.conf;
#   nginx -t && systemctl reload nginx
#
# `always` on every add_header is deliberate: without it Nginx omits the
# header on 4xx/5xx responses, which are exactly the responses an
# attacker is most likely to be looking at.

# ── The static marketing site ────────────────────────────────────────
# Public, unauthenticated, no tokens, no user data. An XSS here is
# defacement rather than account takeover, which is why 'unsafe-inline'
# is acceptable for scripts where it would not be on the admin console:
# a Next static export emits inline bootstrap scripts, and the only
# alternative is per-build hashes that change on every deploy and would
# rot silently the first time someone forgot to regenerate them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Two years, subdomains included. Cloudflare likely sets this too;
# setting it at the origin as well means it is still correct if traffic
# ever reaches the droplet directly.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;

# Belt and braces with the CSP's frame-ancestors: this one is understood
# by older browsers that ignore CSP level 2.
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

add_header X-DNS-Prefetch-Control "off" always;

# Do not advertise the server version in the Server header.
server_tokens off;

# ── A note on the proxied apps ───────────────────────────────────────
# If you ever add `add_header` inside a location that proxies to admin /
# seller / track, remember Nginx's inheritance rule: add_header in a
# location REPLACES the whole inherited set rather than merging with it.
# So a single add_header in a proxy location would silently drop every
# header above. Either include this snippet again in that location, or —
# better — leave the proxied apps to set their own, which they already
# do correctly.
