# ChatWoot self-host stack — copy to the chat.skydrop.online droplet at
# /home/chat/chatwoot/docker-compose.yml. Pair with the .env file from
# docs/chatwoot-selfhost.md step 5.
#
# Pinned to a tagged release. Bump deliberately (read ChatWoot's
# upgrade guide each time; their major releases occasionally require
# data migrations).

services:
  base: &base
    image: chatwoot/chatwoot:v3.16.0
    env_file: .env
    volumes:
      - data-storage:/app/storage

  rails:
    <<: *base
    container_name: chatwoot-rails
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'   # nginx terminates TLS, forwards to this
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped

  sidekiq:
    <<: *base
    container_name: chatwoot-sidekiq
    depends_on:
      - postgres
      - redis
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: chatwoot-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    container_name: chatwoot-redis
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  data-storage:
