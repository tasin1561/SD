name: skydrop

services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: skydrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skydrop
      POSTGRES_PASSWORD: skydrop
      POSTGRES_DB: skydrop
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+ wants the mount at /var/lib/postgresql (not .../data);
      # data lives in a major-version subdirectory so pg_upgrade can work cleanly.
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - skydrop-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skydrop -d skydrop']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: skydrop-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      - skydrop-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

networks:
  skydrop-net:
    driver: bridge
