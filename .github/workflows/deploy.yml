name: Deploy

# Runs ONLY after `main` advances. Requires CI to have passed (the CI
# workflow runs on push-to-main; this workflow waits for it and exits
# early if CI didn't succeed).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without a new push.
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: ssh → pull → build → restart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skip if CI didn't pass (a failed CI also triggers workflow_run with
    # conclusion='failure'; we only proceed on 'success' OR manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Trigger deploy on droplet
        # PINNED TO A COMMIT, NOT A TAG — this step is handed the droplet's
        # SSH private key, and a git tag is MOVABLE by the upstream repo's
        # owner. `@v1.2.0` is resolved fresh on every run, so whoever
        # controls that tag controls what reads `secrets.DROPLET_SSH_KEY`.
        # The replacement would exfiltrate the key and run as our deploy
        # user, which holds passwordless sudo for the marketing rsync and
        # can pm2-restart every process on a box that also holds
        # `~/app/.env` — every courier credential, the JWT signing key and
        # the Spaces keys. The deploy would still go green, so nothing
        # would point at it.
        #
        # This is the ONLY action in the estate that receives a secret
        # (ci.yml references none), which is why it is the one pinned.
        # 7eaf766 IS v1.2.0 as of 2026-10-13 — resolved through the git
        # refs API, not copied from a README. To upgrade, resolve the new
        # tag the same way rather than moving back to a tag.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          # The action's own default is 10m, below the job's 15m budget; a
          # full build (seven apps) passed 10m on 2026-09-27 and was killed
          # mid-build. Keep this just under timeout-minutes.
          command_timeout: 14m
          envs: SHA
          # Single shell session. The droplet has scripts/deploy.sh
          # checked in — it's the source of truth for build/seed/restart.
          script: |
            set -e
            cd ~/app
            bash scripts/deploy.sh "$SHA"
