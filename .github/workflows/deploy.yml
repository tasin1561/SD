name: Deploy

# Runs ONLY after `main` advances and CI passed.
#
# WHAT CHANGED (2026-10-28): the droplet no longer builds. It used to
# `pnpm install` and run ten builds — 12m35s on a 2-vCPU box, repeating
# work this runner had already done and discarded, and the place where
# apps/admin ran out of heap twice on 2026-10-27. Now the runner builds,
# tars and uploads; `scripts/deploy.sh` only places and restarts.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: build → ship → swap
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The SHA CI GREEN-LIT, not whatever main points at now. Those
          # differ the moment a second push lands while this one runs,
          # and deploying the newer one would ship code no CI approved.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the affected-app calculation diffs against the
          # SHA the droplet is actually running, which may be many
          # commits back.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Open the SSH channel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # MULTIPLEXING IS LOAD-BEARING, not a tidy-up.
          #
          # The droplet runs `ufw limit OpenSSH`, which drops the 6th
          # connection from one IP inside 30 seconds. This job opens five
          # (keyscan, the affected-base read, mkdir, scp, deploy) — one
          # retry anywhere and the deploy trips the firewall rule it is
          # protected by, which surfaces as a connection timeout with
          # nothing in the logs explaining it.
          #
          # With ControlMaster every ssh/scp after the first rides the
          # SAME TCP connection, so the run costs one. ControlPersist
          # keeps the master alive across steps; 5m comfortably covers a
          # deploy that is now expected to take about one.
          cat >> ~/.ssh/config <<EOF
          Host droplet
            HostName ${{ secrets.DROPLET_HOST }}
            User ${{ secrets.DROPLET_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 5m
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          # Start the master HERE, fully detached.
          #
          # Without this, the first `ssh` in a later step spawns the
          # master as its own child, and that child inherits the step's
          # stdout and stderr. The Actions runner will not finish a step
          # until those descriptors close, so the step sits there while
          # the master lives out its ControlPersist. "Which apps actually
          # changed?" — an SSH read and a git diff — measured 72 SECONDS
          # on 2026-10-28, longer than the entire droplet side of the
          # deploy.
          #
          # `-f -N -M` with every descriptor redirected means the master
          # belongs to no step, and each later ssh/scp just attaches to
          # it.
          ssh -f -N -M droplet </dev/null >/dev/null 2>&1 || true
          ssh -O check droplet 2>&1 | head -1 || true

      - name: Which apps actually changed?
        id: affected
        run: |
          set -euo pipefail
          # Diff against what the droplet is RUNNING, never against HEAD~1.
          # After a failed deploy those differ, and HEAD~1 would ship one
          # commit's worth of apps while the box is several behind.
          BASE="$(ssh droplet 'cat ~/app/.last-deployed-sha 2>/dev/null' || true)"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base ('${BASE:-empty}') — deploying everything"
            APPS="api admin seller track reseller associate marketing"
          else
            echo "base = $BASE"
            CHANGED="$(git diff --name-only "$BASE" "$SHA")"
            # A shared package fans out to every app that consumes it.
            # Erring wide is the cheap direction: a needless rebuild
            # costs seconds, a missed one serves HTML naming chunks the
            # build it never got had deleted.
            if echo "$CHANGED" | grep -qE '^(packages/|pnpm-lock\.yaml|package\.json|turbo\.json|tsconfig)'; then
              echo "shared surface changed — deploying everything"
              APPS="api admin seller track reseller associate marketing"
            else
              APPS=""
              for A in api admin seller track reseller associate marketing; do
                echo "$CHANGED" | grep -qE "^apps/$A/" && APPS="$APPS $A"
              done
              APPS="$(echo "$APPS" | xargs || true)"
            fi
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${APPS:-<nothing>}"

      # CI already built and uploaded these. Downloading beats
      # rebuilding by whatever a cold Next build costs — about 106s on
      # 2026-10-28 for one app, and far more when a shared package
      # changes and all seven rebuild.
      # PINNED TWO WAYS, deliberately.
      #
      # `run-id` is the CI run that triggered THIS deploy, so the search
      # cannot wander to another run. `name` carries the commit SHA, so
      # even within that run it cannot pick up a different commit's
      # build. Neither alone is enough: without run-id the action takes
      # the latest matching artifact in the repository, which during
      # concurrent merges is somebody else's code; without the SHA in
      # the name, a re-run of an older CI would serve an older build to
      # a newer deploy.
      #
      # The `if` requires a run-id rather than letting an empty one fail
      # — a guarantee that holds because it is checked is worth more
      # than one that holds because a step happened to error.
      - name: Download CI's build
        id: artifact
        if: steps.affected.outputs.apps != '' && github.event.workflow_run.id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-${{ env.SHA }}
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # The fallback is not decoration. A manual re-deploy
      # (workflow_dispatch) has no CI run to take an artifact from, and
      # an artifact expires after three days. Without this, either case
      # is a deploy that cannot run at all.
      - name: Build (only if CI's artifact was unavailable)
        if: steps.affected.outputs.apps != '' && steps.artifact.outcome != 'success'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          echo "no artifact for ${SHA} — building here instead"
          FILTERS=""
          for A in ${{ steps.affected.outputs.apps }}; do
            FILTERS="$FILTERS --filter=@skydrop/$A"
          done
          pnpm turbo run build $FILTERS --concurrency=100%
          mkdir -p out
          tar -czf out/packages.tgz packages/*/dist
          for A in ${{ steps.affected.outputs.apps }}; do
            case "$A" in
              api)       tar -czf out/api.tgz       -C apps/api/dist . ;;
              marketing) tar -czf out/marketing.tgz -C apps/marketing/out . ;;
              *)         tar -czf "out/$A.tgz" --exclude=./cache -C "apps/$A/.next" . ;;
            esac
          done

      - name: Check what we are about to ship
        if: steps.affected.outputs.apps != ''
        run: |
          set -euo pipefail
          echo "── archive check ──"
          for F in out/*.tgz; do
            B="$(basename "$F" .tgz)"
            case "$B" in
              api)       NEED='./main.js' ;;
              packages)  NEED='' ;;
              marketing) NEED='./index.html' ;;
              *)         NEED='./BUILD_ID' ;;
            esac
            if [ -n "$NEED" ]; then
              # Listing captured first: grep -q closes the pipe, tar takes
              # SIGPIPE, and under pipefail the check fails on a good
              # archive. That happened on 2026-10-28.
              LISTING="$(tar -tzf "$F")"
              if ! printf '%s\n' "$LISTING" | grep -qx "$NEED"; then
                echo "!! $F does not contain $NEED"
                printf '%s\n' "$LISTING" | head -5
                exit 1
              fi
            fi
            printf '  %-14s %-7s ok\n' "$B" "$(du -h "$F" | cut -f1)"
          done
          echo "── total shipped: $(du -ch out/*.tgz | tail -1 | cut -f1) ──"

      - name: Ship and swap
        if: steps.affected.outputs.apps != ''
        run: |
          set -euo pipefail
          ssh droplet "rm -rf ~/app/.deploy-incoming/$SHA && mkdir -p ~/app/.deploy-incoming/$SHA"
          scp out/*.tgz "droplet:~/app/.deploy-incoming/$SHA/"
          # deploy.sh still git-pulls: it is itself versioned, and so are
          # ecosystem.config.cjs, the prisma migrations and the seed.
          ssh droplet "cd ~/app && bash scripts/deploy.sh $SHA ${{ steps.affected.outputs.apps }}"

      - name: Nothing to do
        if: steps.affected.outputs.apps == ''
        run: echo "No app changed since the droplet's last deploy — nothing shipped."
