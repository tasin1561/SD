name: Deploy

# Runs ONLY after `main` advances and CI passed.
#
# WHAT CHANGED (2026-10-28): the droplet no longer builds. It used to
# `pnpm install` and run ten builds — 12m35s on a 2-vCPU box, repeating
# work this runner had already done and discarded, and the place where
# apps/admin ran out of heap twice on 2026-10-27. Now the runner builds,
# tars and uploads; `scripts/deploy.sh` only places and restarts.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: build → ship → swap
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The SHA CI GREEN-LIT, not whatever main points at now. Those
          # differ the moment a second push lands while this one runs,
          # and deploying the newer one would ship code no CI approved.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the affected-app calculation diffs against the
          # SHA the droplet is actually running, which may be many
          # commits back.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Open the SSH channel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # NO ControlMaster. It cost more than it saved.
          #
          # The droplet runs `ufw limit OpenSSH`, dropping the 6th
          # connection from one IP inside 30 seconds, and this job used
          # to open five — so multiplexing looked like the answer. It was
          # not: the master is a background process that inherits a
          # step's stdout and stderr, and the Actions runner will not end
          # a step until those close. The wait simply MOVED. "Which apps
          # changed?" went 72s → 1s and "Open the SSH channel" went 4s →
          # 73s, which is the same 72 seconds wearing a different label.
          #
          # The real fix is to need fewer connections, not to pool them.
          # This deploy now opens TWO in total: the keyscan above, and
          # one pipeline that streams the artifacts in and runs the
          # deploy on the far end. Nothing to persist, nothing to detach,
          # nothing to wait on.
          cat >> ~/.ssh/config <<EOF
          Host droplet
            HostName ${{ secrets.DROPLET_HOST }}
            User ${{ secrets.DROPLET_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF

      # PINNED TWO WAYS. `run-id` is the CI run that triggered this
      # deploy, so the search cannot wander to another run; the commit
      # SHA in the name means it cannot pick up a different commit's
      # build even within that run. Without run-id the action takes the
      # newest matching artifact in the repository, which during
      # concurrent merges is somebody else's code.
      - name: Download CI's build
        id: artifact
        if: github.event.workflow_run.id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-${{ env.SHA }}
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # A manual workflow_dispatch has no CI run to take an artifact
      # from, and artifacts expire after three days. Without this, both
      # cases are a deploy that cannot run at all.
      - name: Build (only if CI's artifact was unavailable)
        if: steps.artifact.outcome != 'success'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          echo "no artifact for ${SHA} — building here instead"
          pnpm turbo run build --filter='@skydrop/*' --concurrency=100%
          mkdir -p out
          tar -czf out/packages.tgz packages/*/dist
          tar -czf out/api.tgz -C apps/api/dist .
          tar -czf out/marketing.tgz -C apps/marketing/out .
          for A in admin seller track reseller associate; do
            tar -czf "out/$A.tgz" --exclude=./cache -C "apps/$A/.next" .
          done

      - name: Check what we are about to ship
        run: |
          set -euo pipefail
          echo "── archive check ──"
          for F in out/*.tgz; do
            B="$(basename "$F" .tgz)"
            case "$B" in
              api)       NEED='./main.js' ;;
              packages)  NEED='' ;;
              marketing) NEED='./index.html' ;;
              *)         NEED='./BUILD_ID' ;;
            esac
            if [ -n "$NEED" ]; then
              # HERESTRING, not a pipe. `grep -q` exits at the first
              # match and closes its input; the writer takes SIGPIPE and
              # under `set -o pipefail` the pipeline reports that, so the
              # check fails on a GOOD archive. Capturing the listing into
              # a variable first did NOT fix this — `printf | grep -q`
              # has exactly the same shape as `tar | grep -q`. The pipe
              # itself is the problem; a herestring has none.
              LISTING="$(tar -tzf "$F")"
              if ! grep -qx "$NEED" <<<"$LISTING"; then
                echo "!! $F does not contain $NEED"
                head -5 <<<"$LISTING"
                exit 1
              fi
            fi
            printf '  %-14s %-7s ok\n' "$B" "$(du -h "$F" | cut -f1)"
          done
          echo "── total: $(du -ch out/*.tgz | tail -1 | cut -f1) ──"

      # ONE connection. Keyscan above plus this is the whole deploy.
      #
      # `ufw limit OpenSSH` drops the 6th connection from one IP inside
      # 30 seconds, and the old shape opened five — mkdir, scp, deploy,
      # plus a marker read, plus the keyscan. ControlMaster pooled them
      # and cost 72 seconds of a step waiting on a background process it
      # could not see.
      #
      # So the archives are streamed INTO the far end's tar over stdin,
      # and the same command runs the deploy. Nothing is persisted, and
      # which apps to place is decided on the droplet — it already holds
      # the marker and the diff, so asking it for that over a second
      # connection was always the wasteful part.
      - name: Ship and deploy (one connection)
        run: |
          set -euo pipefail
          tar -cz -C out . | ssh droplet "
            set -e
            D=~/app/.deploy-incoming/${SHA}
            rm -rf \$D && mkdir -p \$D
            tar -xz -C \$D
            cd ~/app && bash scripts/deploy.sh ${SHA}
          "
