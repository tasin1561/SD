name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs of the same ref — on main as well as on PRs.
#
# It used to be PR-only, which meant a rapid series of pushes to main left
# every superseded run going to completion: five pushes in ten minutes
# billed five full runs to verify four commits nobody would deploy. Deploy
# keys off CI success, so a cancelled run simply does not deploy — the
# newer commit's run does, which is the one you wanted anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────
# SHAPE OF THIS FILE — four jobs, all in parallel (2026-08-03)
#
# It used to be two: a `checks` job running everything in sequence, and
# `browser`. `checks` took 12m and `browser` 5m, so every push cost ~12m of
# CI plus 4m of Deploy behind it — and the work inside `checks` had no
# ordering requirement at all. Lint does not depend on the e2e suite.
#
# Measured breakdown of the old 12 minutes: e2e 252s, four Next builds
# 155s, typecheck 95s, lint 30s, format 21s, unit 48s, package builds 52s,
# runner + container setup ~68s. Split by what actually needs to be
# together, the longest single job is the e2e suite, so that is now the
# whole critical path.
#
# TWO THINGS TO KNOW BEFORE EDITING:
#
# 1. Parallel jobs each pay setup + package builds again (~2m apiece).
#    That is deliberate: it costs more runner-minutes and less wall clock,
#    and wall clock is what someone is sitting through. Passing the built
#    packages between jobs as artifacts was the alternative and is WORSE —
#    it reintroduces a serial dependency longer than the rebuild it saves.
#
# 2. `browser` is the ONLY job that builds the Next apps, and that build
#    IS the build check. It used to happen in both, and the `browser` copy
#    is the correct one: this file set `NODE_ENV: test` job-wide, so the
#    old `checks` build produced test-env frontends and proved nothing
#    about what ships. Do not "restore" a build step elsewhere — and note
#    that removing an app from the browser job's build list stops its
#    build being checked anywhere at all.
# ─────────────────────────────────────────────────────────────────────────

jobs:
  # ── What changed ─────────────────────────────────────────────────────
  # The two expensive jobs gate on this. A CSS-only push was running the
  # full 29-suite API e2e job, which is most of where the month's minutes
  # went.
  #
  # FAIL-SAFE BY CONSTRUCTION: anything it cannot determine — a first
  # push, a force-push, a re-run where the before-SHA is unavailable —
  # returns true for everything and the full suite runs. A filter that
  # errs toward skipping is a filter that eventually hides a real break.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # all-zeros = branch creation; empty = unavailable. Either way, run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base unavailable — running everything"
            echo "api=true"      >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "$FILES" | sed 's/^/  /'
          match() { echo "$FILES" | grep -qE "$1"; }
          # packages/db and the workflow itself feed BOTH: a schema or type
          # change can break an API test and a frontend build equally.
          API=false; FE=false
          match '^(apps/api/|packages/db/|\.github/)' && API=true
          match '^(apps/(admin|seller|track|marketing)/|packages/(ui|api-client|auth|db)/|e2e-shared/|playwright\.config|\.github/)' && FE=true
          echo "api=$API"      >> "$GITHUB_OUTPUT"
          echo "frontend=$FE"  >> "$GITHUB_OUTPUT"
          echo "→ api=$API frontend=$FE"

  # ── Static analysis ──────────────────────────────────────────────────
  # No database, no Redis: tsc and eslint never run the app, and skipping
  # the service containers takes ~30s off this job's startup.
  static:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: Typecheck — all workspaces
        run: pnpm -r typecheck

      - name: Lint — all workspaces that have lint
        run: pnpm -r --if-present lint

      # The repo has shipped a .prettierrc since M0 that nothing enforced,
      # and ~600 files had drifted from it. Normalised 2026-07-27; this
      # step is what stops it happening again. `.prettierignore` is the
      # single source of what is excluded (notably *.md — prose keeps its
      # author's formatting).
      - name: Format check
        run: pnpm format:check

      # The seam between the two halves. Each side's own tests pass while
      # the path joining them is wrong — three bugs in one day were this
      # exact shape, and none of them were caught by a unit test.
      - name: Frontend calls resolve to real API routes
        run: python3 scripts/check-frontend-routes.py

      # The OTHER seam: a page reachable by one permission that fetches
      # something needing another. The visitor did nothing wrong and gets
      # a 403 on a page working exactly as designed — it happened to a
      # call agent on the admin dashboard and a viewer on the seller one,
      # and neither was caught by a test that only opens the page.
      - name: Pages ask only for what their gate allows
        run: python3 scripts/check-page-permissions.py

  # ── Unit tests ───────────────────────────────────────────────────────
  # Mocked-Prisma suites, so the service containers are insurance rather
  # than a requirement — a job that fails on a missing socket instead of a
  # real assertion is a slow and confusing way to learn that.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
      RESEND_API_KEY: ''
      JWT_ACCESS_SECRET: ci-access-secret-not-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-prod
      COURIER_CREDENTIALS_KEY_v1: ci-aes-gcm-32byte-key-padding-32x
      TRACKING_WEBHOOK_SECRET_DELHIVERY: ci-tracking-webhook
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      API_BASE_URL: http://localhost:4000
      DO_SPACES_ACCESS_KEY: ci-stub
      DO_SPACES_SECRET_KEY: ci-stub
      DO_SPACES_BUCKET: ci-stub
      DO_SPACES_REGION: sgp1
      DO_SPACES_ENDPOINT: https://sgp1.digitaloceanspaces.com

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      # No Postgres, no Redis, no migrate. The API unit suite uses mocked
      # Prisma throughout and `app-module-boots` compiles the Nest
      # container without running onModuleInit, so nothing here opens a
      # connection — the same 1845 tests run locally on a machine with no
      # Docker at all. DATABASE_URL stays set because the Prisma client is
      # constructed at import time; it is never dialled.
      - name: Unit tests — API (jest)
        run: pnpm --filter @skydrop/api test

      - name: Unit tests — admin (vitest)
        run: pnpm --filter @skydrop/admin test

      - name: Unit tests — seller (vitest)
        run: pnpm --filter @skydrop/seller test

      - name: Unit tests — packages
        run: pnpm --filter './packages/*' --if-present test

  # ── API e2e ──────────────────────────────────────────────────────────
  # The long pole, and therefore the critical path. It stays a single
  # sequential job on purpose: the harness's global setup DROPS and
  # recreates the shared test database, so two runners pointed at one
  # database report mass fake failures. Sharding it needs a database per
  # shard first — worth doing when four minutes starts to hurt, not
  # before.
  #
  # This suite was previously NEVER run by CI — it only ran on a dev
  # machine, and had in fact been fully wedged for a while (a reset-chain
  # FK violation) with nothing watching. Running it here is what makes the
  # cross-lifecycle invariants (stock conservation through RTO, order
  # lifecycle, seller RBAC on real requests) enforced rather than assumed.
  e2e:
    name: e2e — API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # The M0 migration needs (a) the timescaledb extension AND
      # (b) Postgres 18's built-in `uuidv7()` for every table's
      # default. timescale/timescaledb-ha:pg18 has both (it tracks
      # what prod's DO Managed Postgres 18 + Timescale add-on
      # provides).
      postgres:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: skydrop
          POSTGRES_PASSWORD: skydrop
          POSTGRES_DB: skydrop_test
        options: >-
          --health-cmd "pg_isready -U skydrop -d skydrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
      RESEND_API_KEY: ''
      JWT_ACCESS_SECRET: ci-access-secret-not-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-prod
      COURIER_CREDENTIALS_KEY_v1: ci-aes-gcm-32byte-key-padding-32x
      TRACKING_WEBHOOK_SECRET_DELHIVERY: ci-tracking-webhook
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      API_BASE_URL: http://localhost:4000
      DO_SPACES_ACCESS_KEY: ci-stub
      DO_SPACES_SECRET_KEY: ci-stub
      DO_SPACES_BUCKET: ci-stub
      DO_SPACES_REGION: sgp1
      DO_SPACES_ENDPOINT: https://sgp1.digitaloceanspaces.com
      # e2e MUST NOT touch live object storage. Without this the suite
      # builds a real S3 client and calls DigitalOcean with the stub
      # bucket above, so AWB label upload, the CSV error reports and the
      # catalog image test all depend on a third party being reachable
      # and answering the way they did last time. It cost a red run whose
      # failures (NoSuchBucket, and an AWB job that therefore never
      # confirmed its manifest) pointed at five unrelated subsystems.
      # The browser job has always set this; e2e was the gap.
      #
      # Note the DO_SPACES_* names above are read by NOTHING — the app
      # wants SPACES_ACCESS_KEY_ID / SPACES_SECRET_ACCESS_KEY — so they
      # never stood in for credentials either. Left in place rather than
      # deleted in the same change that fixes the red.
      DEV_MOCK_SPACES: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          # apps/api's ONLY workspace dependency. The three frontend
          # packages cost ~35s here and nothing in this job imports them.
          packages: db

      - name: Prisma migrate (test DB)
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy

      # TEST_DB_DOCKER_CONTAINER='' switches the harness from
      # `docker exec skydrop-postgres` (local dev) to a direct TCP psql
      # against the service container above.
      - name: E2E tests — API (jest, runInBand)
        env:
          TEST_DB_DOCKER_CONTAINER: ''
        run: pnpm --filter @skydrop/api test:e2e

  # ── Browser specs ────────────────────────────────────────────────────
  # Its own job, not a step alongside the API e2e, for one concrete
  # reason: that suite's global teardown DROPS the test database, and
  # anything needing a live API afterwards would come up against nothing.
  #
  # These specs cover seams nothing else can: the FE-3 same-origin proxy,
  # the FE-4 SSR cookie gate, FE-2 server-verdict-verbatim, the nonce CSP,
  # and phone-width layout — all of which only exist in a real browser
  # talking to a real Next server. It is also, per the note at the top of
  # this file, where the Next apps get built and therefore where a broken
  # build is caught.
  browser:
    name: browser specs (playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: skydrop
          POSTGRES_PASSWORD: skydrop
          POSTGRES_DB: skydrop_test
        options: >-
          --health-cmd "pg_isready -U skydrop -d skydrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    # Exactly what apps/api/src/config/env.schema.ts declares REQUIRED,
    # plus the proxy target. Deliberately NOT a copy of the other jobs'
    # env: that block carries several names the app never reads (the test
    # harness does), and copying it is how this job's first run failed —
    # JWT_ACCESS_SECRET is not JWT_SIGNING_KEY, so the boot died on a
    # missing variable that looked present.
    #
    # NODE_ENV and PORT are scoped to the API step instead of set here:
    # `next start` chooses its own, and a job-wide NODE_ENV=test would
    # reach frontends that were built for production.
    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      # min 32 chars, enforced by the schema.
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-prod-32-chars-min
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      # What the Next route-handler proxy forwards to (FE-3).
      API_ORIGIN: http://localhost:4000
      # Empty key = the NOTIF-6 dev stub; no mail leaves CI.
      RESEND_API_KEY: ''
      # No real object storage in CI.
      DEV_MOCK_SPACES: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: Prisma migrate + seed
        working-directory: packages/db
        # Seeded because the API reads system_settings on boot; the login
        # specs deliberately need no seeded USER (they assert on the
        # server's generic 401 for an unknown email).
        run: |
          pnpm exec prisma migrate deploy
          pnpm run seed

      - name: Build the API and the four frontends
        run: |
          pnpm --filter @skydrop/api build
          pnpm --filter @skydrop/admin build
          pnpm --filter @skydrop/seller build
          pnpm --filter @skydrop/track build
          # Marketing is a static export; its `start` serves out/ via
          # scripts/serve-static.mjs, so the build must run first here
          # even though nothing else in this job consumes it.
          pnpm --filter @skydrop/marketing build

      # Cache the browser binary. The download is ~120MB and identical
      # between runs; keyed on the lockfile so a Playwright bump busts it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        # BOUNDED AND RETRIED, because this step is the one that talks to
        # the outside world and it has hung twice for 20+ minutes on
        # `apt-get` against archive.ubuntu.com. Unbounded, it ate the
        # job's whole 25-minute budget and was then cancelled by the next
        # push — which reads in the run list as "CI cancelled", tells you
        # nothing about why, and silently stops the deploy. Two commits
        # went undeployed that way before anyone looked at the log.
        #
        # 8 minutes is several times the normal 40 seconds, so a genuine
        # slow runner still passes; a stall fails fast and says so. The
        # retry covers the transient case, which is what this has been
        # every time so far.
        timeout-minutes: 8
        run: |
          pnpm exec playwright install --with-deps chromium \
            || { echo "::warning::playwright install failed once, retrying"; \
                 sleep 5; pnpm exec playwright install --with-deps chromium; }

      - name: Start the API
        env:
          NODE_ENV: test
          PORT: 4000
        run: |
          pnpm --filter @skydrop/api start > /tmp/api.log 2>&1 &
          # Wait for readiness rather than sleeping — a fixed sleep is
          # either too short on a slow runner or wasted on a fast one.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/ready > /dev/null 2>&1; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready — last 80 log lines:"; tail -80 /tmp/api.log; exit 1

      - name: Browser specs
        # The admin + seller + track + marketing servers are auto-spawned
        # by playwright's webServer config (built output in CI, not
        # `dev`).
        run: pnpm e2e:fe

      - name: API log on failure
        if: failure()
        run: tail -200 /tmp/api.log

      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
