name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs of the same ref — on main as well as on PRs.
#
# It used to be PR-only, which meant a rapid series of pushes to main left
# every superseded run going to completion: five pushes in ten minutes
# billed five full runs to verify four commits nobody would deploy. Deploy
# keys off CI success, so a cancelled run simply does not deploy — the
# newer commit's run does, which is the one you wanted anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────
# SHAPE OF THIS FILE — four jobs, all in parallel (2026-08-03)
#
# It used to be two: a `checks` job running everything in sequence, and
# `browser`. `checks` took 12m and `browser` 5m, so every push cost ~12m of
# CI plus 4m of Deploy behind it — and the work inside `checks` had no
# ordering requirement at all. Lint does not depend on the e2e suite.
#
# Measured breakdown of the old 12 minutes: e2e 252s, four Next builds
# 155s, typecheck 95s, lint 30s, format 21s, unit 48s, package builds 52s,
# runner + container setup ~68s. Split by what actually needs to be
# together, the longest single job is the e2e suite, so that is now the
# whole critical path.
#
# TWO THINGS TO KNOW BEFORE EDITING:
#
# 1. Parallel jobs each pay setup + package builds again (~2m apiece).
#    That is deliberate: it costs more runner-minutes and less wall clock,
#    and wall clock is what someone is sitting through. Passing the built
#    packages between jobs as artifacts was the alternative and is WORSE —
#    it reintroduces a serial dependency longer than the rebuild it saves.
#
# 2. `browser` is the ONLY job that builds the Next apps, and that build
#    IS the build check. It used to happen in both, and the `browser` copy
#    is the correct one: this file set `NODE_ENV: test` job-wide, so the
#    old `checks` build produced test-env frontends and proved nothing
#    about what ships. Do not "restore" a build step elsewhere — and note
#    that removing an app from the browser job's build list stops its
#    build being checked anywhere at all.
# ─────────────────────────────────────────────────────────────────────────

jobs:
  # ── What changed ─────────────────────────────────────────────────────
  # The two expensive jobs gate on this. A CSS-only push was running the
  # full 29-suite API e2e job, which is most of where the month's minutes
  # went.
  #
  # FAIL-SAFE BY CONSTRUCTION: anything it cannot determine — a first
  # push, a force-push, a re-run where the before-SHA is unavailable —
  # returns true for everything and the full suite runs. A filter that
  # errs toward skipping is a filter that eventually hides a real break.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      frontend: ${{ steps.f.outputs.frontend }}
      # Which frontends to run browser specs for, and whether the change
      # is one where "affected only" must not apply.
      apps: ${{ steps.f.outputs.apps }}
      full: ${{ steps.f.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # all-zeros = branch creation; empty = unavailable. Either way, run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base unavailable — running everything"
            echo "api=true"      >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "$FILES" | sed 's/^/  /'
          # HERESTRING, not a pipe — and this one is the dangerous
          # instance. `grep -q` exits at the first match and closes its
          # input; `echo` takes SIGPIPE, and under `set -o pipefail` the
          # function returns NON-ZERO on a successful match.
          #
          # It only bites once $FILES outgrows the 64 KB pipe buffer, so
          # it has been invisible on ordinary diffs and would appear on a
          # large one — a refactor, a rename, a dependency bump. And it
          # fails in the worst direction: `match` returning false means a
          # change is judged NOT to affect the API or the frontends, so
          # the suites that would have caught it are skipped and CI goes
          # green. Loud failures are survivable; this one is silent.
          match() { grep -qE "$1" <<<"$FILES"; }
          # packages/db and the workflow itself feed BOTH: a schema or type
          # change can break an API test and a frontend build equally.
          API=false; FE=false
          match '^(apps/api/|packages/db/|\.github/)' && API=true
          # apps/api IS a frontend trigger. Every console talks to it
          # through the same-origin proxy, so a route, DTO or guard
          # change there breaks the browser specs without touching a
          # single frontend file — and those specs are the only thing
          # that exercises the seam.
          match '^(apps/(api|admin|seller|track|marketing|reseller|associate)/|packages/(ui|api-client|auth|db)/|e2e-shared/|playwright\.config|\.github/)' && FE=true
          # The dependency graph feeds BOTH, and is the riskiest change of
          # all: a lockfile or override edit swaps the code every app runs
          # without touching one app's source. 029584ec (sharp/multer/qs/
          # js-yaml overrides) matched neither pattern, so e2e and browser
          # were skipped on exactly the change they exist to catch.
          DEPS='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|\.npmrc|\.nvmrc)$'
          match "$DEPS" && { API=true; FE=true; }

          # ── FULL GATE ──────────────────────────────────────────────
          # Affected-only is an optimisation, and these are the paths
          # where being wrong is most expensive. A change here runs
          # EVERYTHING, regardless of which app's folder it sits in.
          #
          # Money: a wallet or ledger edit can only be judged against the
          # whole suite, because the thing that breaks is an invariant
          # two modules away. Couriers: a payload change is read by the
          # courier, not by us, and the proof is e2e. Auth: a guard
          # change is cross-cutting by definition. Migrations: the schema
          # is the one thing every package compiles against.
          FULL='^(apps/api/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|turbo\.json|tsconfig|\.github/|apps/api/src/(modules/(wallet|seller-wallet|ledger|remittance|treasury|courier-[a-z-]+|order-money|reseller-order-money|inbound-freight|pnl)|common/auth)/|apps/api/src/common/guards/|packages/db/prisma/(migrations|schema))'
          FULLGATE=false
          match "$FULL" && FULLGATE=true

          # Which FRONTENDS changed, for the browser matrix. On a full
          # gate every app is named, so nothing is skipped.
          APPS=""
          if [ "$FULLGATE" = true ]; then
            APPS="admin seller track reseller associate marketing"
          else
            for A in admin seller track reseller associate marketing; do
              match "^apps/$A/" && APPS="$APPS $A"
            done
            APPS="$(echo "$APPS" | xargs || true)"
          fi

          echo "api=$API"      >> "$GITHUB_OUTPUT"
          echo "frontend=$FE"  >> "$GITHUB_OUTPUT"
          echo "apps=$APPS"    >> "$GITHUB_OUTPUT"
          echo "full=$FULLGATE" >> "$GITHUB_OUTPUT"
          echo "→ api=$API frontend=$FE full=$FULLGATE apps=[${APPS:-none}]"

  # ── Static analysis ──────────────────────────────────────────────────
  # No database, no Redis: tsc and eslint never run the app, and skipping
  # the service containers takes ~30s off this job's startup.
  # Six GROUPS, not fifteen packages.
  #
  # One job per package would be ~15 typecheck + ~15 lint jobs, and on
  # top of unit, e2e, browser and build that is well past GitHub's
  # concurrent-job cap (20 on Free). Past the cap jobs queue in waves and
  # the wall clock gets WORSE, not better — the parallelism is imaginary.
  # Grouping keeps every heavy package on its own runner while the whole
  # matrix still fits.
  #
  # Typecheck and lint run together per group because they share the
  # expensive part: the workspace install and the ^build of the packages
  # the group depends on. Splitting them doubles that cost to save
  # nothing.
  static:
    name: static (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # FOUR groups, and the repo-wide checks ride with `packages`.
        #
        # The cap is 20 concurrent jobs for the whole ACCOUNT — CodeQL,
        # Dependabot and Deploy draw on it too — so this pipeline budgets
        # 18: changes 1 + static 4 + unit 4 + e2e 4 + browser 4 + build 1.
        # Past the cap jobs queue in waves and the wall clock gets worse,
        # which is the opposite of the point.
        # The value is the WHOLE --filter expression, quotes included.
        # `./packages/*` must stay quoted: unquoted, the shell expands it
        # before pnpm sees it and pnpm reads the second path as the
        # SCRIPT NAME ("None of the selected packages has a
        # './packages/auth' script").
        group:
          - { name: api, filter: '--filter @skydrop/api' }
          - { name: consoles, filter: '--filter @skydrop/admin --filter @skydrop/seller' }
          - {
              name: stores-public,
              filter: '--filter @skydrop/reseller --filter @skydrop/associate --filter @skydrop/track --filter @skydrop/marketing',
            }
          - { name: packages, filter: "--filter './packages/*'" }

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      # tsc --build is incremental, and .tsbuildinfo is what makes it so.
      # Keyed on the lockfile plus the group, restored loosely so a
      # near-miss still saves most of the work.
      - name: Restore tsbuildinfo
        uses: actions/cache@v4
        with:
          path: |
            **/*.tsbuildinfo
            **/.eslintcache
          key: static-${{ matrix.group.name }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            static-${{ matrix.group.name }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            static-${{ matrix.group.name }}-${{ runner.os }}-

      - name: Typecheck
        run: pnpm ${{ matrix.group.filter }} typecheck

      - name: Lint
        run: pnpm ${{ matrix.group.filter }} --if-present lint

      - name: Format check
        if: matrix.group.name == 'packages'
        run: pnpm format:check

      # packages/ui/src/brand/{scales,theme}.css are byte-identical copies
      # of apps/marketing's token files (apps restyle, decision 1): the
      # five apps read one palette while marketing stays untouched. A copy
      # is only safe while it is identical; this fails on any drift.
      - name: Brand tokens match marketing
        if: matrix.group.name == 'packages'
        run: node packages/ui/scripts/check-brand-tokens.mjs

      # Every text/surface and chip pairing of the apps' brand skin, in
      # both themes, computed from the real tokens (4.5:1 text, 3:1 UI).
      - name: Brand contrast
        if: matrix.group.name == 'packages'
        run: node packages/ui/scripts/contrast.mjs

      # The seam between the two halves. Each side's own tests pass while
      # the path joining them is wrong — three bugs in one day were this
      # exact shape, and none of them were caught by a unit test.
      - name: Frontend calls resolve to real API routes
        if: matrix.group.name == 'packages'
        run: python3 scripts/check-frontend-routes.py

      # The OTHER seam: a page reachable by one permission that fetches
      # something needing another. The visitor did nothing wrong and gets
      # a 403 on a page working exactly as designed — it happened to a
      # call agent on the admin dashboard and a viewer on the seller one,
      # and neither was caught by a test that only opens the page.
      - name: Pages ask only for what their gate allows
        if: matrix.group.name == 'packages'
        run: python3 scripts/check-page-permissions.py

  # ── Unit tests ───────────────────────────────────────────────────────
  # Mocked-Prisma suites, so the service containers are insurance rather
  # than a requirement — a job that fails on a missing socket instead of a
  # real assertion is a slow and confusing way to learn that.
  # FOUR groups, balanced by measured time rather than by package count.
  #
  # Measured 2026-10-28: api 135s (491 suites), admin 69s, seller 37s,
  # reseller 32s, auth 15s, associate 10s, api-client 1s. The API is
  # jest and splits with --shard; the frontends are vitest and are
  # cheaper to group whole than to shard.
  #
  # app-module-boots.spec.ts lives in the API half and therefore runs on
  # every CI run. It is 54s on its own — the single slowest suite in the
  # repo — and it is the only thing that proves the app starts, so it is
  # never filtered out, only placed.

  # The repo-wide checks. Seconds each, and all of them read the whole
  # tree, so they belong in one job rather than repeated per group.
  unit:
    name: unit (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: api-1, kind: api, shard: '1/2' }
          - { name: api-2, kind: api, shard: '2/2' }
          - { name: consoles, kind: fe, filter: '--filter @skydrop/admin --filter @skydrop/seller' }
          - {
              name: stores-pkgs,
              kind: fe,
              filter: "--filter @skydrop/reseller --filter @skydrop/associate --filter './packages/*'",
            }

    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
      RESEND_API_KEY: ''
      JWT_ACCESS_SECRET: ci-access-secret-not-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-prod
      COURIER_CREDENTIALS_KEY_v1: ci-aes-gcm-32byte-key-padding-32x
      TRACKING_WEBHOOK_SECRET_DELHIVERY: ci-tracking-webhook
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      API_BASE_URL: http://localhost:4000
      DO_SPACES_ACCESS_KEY: ci-stub
      DO_SPACES_SECRET_KEY: ci-stub
      DO_SPACES_BUCKET: ci-stub
      DO_SPACES_REGION: sgp1
      DO_SPACES_ENDPOINT: https://sgp1.digitaloceanspaces.com

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      # No Postgres, no Redis, no migrate. The API unit suite uses mocked
      # Prisma throughout and `app-module-boots` compiles the Nest
      # container without running onModuleInit, so nothing here opens a
      # connection — the same ~7,600 tests (472 files) run locally on a
      # machine with no Docker at all. DATABASE_URL stays set because the
      # Prisma client is constructed at import time; it is never dialled.
      - name: Unit tests — API (jest, ${{ matrix.part.shard }})
        if: matrix.part.kind == 'api'
        # HEADROOM, beside the per-worker recycling in jest.config.ts.
        #
        # Node's default old-space is ~2 GB and this suite died exactly
        # there on 2026-10-13 ("Ineffective mark-compacts near heap
        # limit", exit 134) on a commit that touched only infra/ — no
        # workspace code and no new tests — forty minutes after the same
        # suite passed. The runner has far more memory than the default
        # lets Node use, so raising the ceiling costs nothing and stops a
        # red build that means nothing.
        #
        # The real fix is `workerIdleMemoryLimit` in jest.config.ts,
        # which bounds growth rather than permitting more of it. This is
        # the belt to that pair of braces.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # `exec jest`, not `test -- …`. The package script is
        # `jest --config jest.config.ts`, and `pnpm … test -- args`
        # appends a bare `--`, which jest reads as "positional args
        # follow" — so --shard became a TEST PATH PATTERN and matched
        # nothing: "Pattern: --passWithNoTests|--shard=1/2 - 0 matches".
        run: pnpm --filter @skydrop/api exec jest --config jest.config.ts --passWithNoTests --shard=${{ matrix.part.shard }}

      # The frontends are vitest. An app missing from a filter here is an
      # app whose unit tests never run, which looks exactly like an app
      # that has none — so the two frontend groups between them must name
      # every one: admin, seller, reseller, associate, and ./packages/*.
      - name: Unit tests — frontends (vitest)
        if: matrix.part.kind == 'fe'
        run: pnpm ${{ matrix.part.filter }} --if-present test

  # ── API e2e ──────────────────────────────────────────────────────────
  # The long pole, and therefore the critical path. It stays a single
  # sequential job on purpose: the harness's global setup DROPS and
  # recreates the shared test database, so two runners pointed at one
  # database report mass fake failures. Sharding it needs a database per
  # shard first — worth doing when four minutes starts to hurt, not
  # before.
  #
  # This suite was previously NEVER run by CI — it only ran on a dev
  # machine, and had in fact been fully wedged for a while (a reset-chain
  # FK violation) with nothing watching. Running it here is what makes the
  # cross-lifecycle invariants (stock conservation through RTO, order
  # lifecycle, seller RBAC on real requests) enforced rather than assumed.
  e2e:
    name: e2e — API (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # SHARDED because the suite is ~250s of test time spread flat across
    # 29 files — the slowest single suite is 25s, so there is no hot spec
    # to optimise, only serialism to remove.
    #
    # The sharding is at the JOB level, deliberately, and NOT jest
    # workers inside one job. The suites share one test database and the
    # global setup DROPS and recreates it, so concurrent workers destroy
    # each other's data — making that safe would mean per-worker
    # databases, touching global setup, the reset-helper chain and the
    # Prisma singleton, which is real flakiness risk for the same payoff.
    # A matrix job already gets its OWN Postgres service container, so
    # every shard has a private database and total isolation for free,
    # and each still runs --runInBand within itself.
    #
    # FOUR, measured rather than guessed. Jest shards by FILE, not by
    # duration, so the split is only as even as the files happen to be:
    # against the real per-suite timings, 3 shards leaves one holding
    # 124s while its siblings do ~78s, and FIVE is WORSE than four
    # (96s vs 88s critical path) because one heavy clump still dominates
    # and the extra job only adds its own overhead. Re-measure before
    # changing this number; the intuition that "more shards is faster"
    # is wrong here.
    #
    # Cost: each shard pays the container + workspace setup again (~60s).
    # That is the same runner-minutes-for-wall-clock trade this workflow
    # already makes by having each job rebuild the workspace.
    strategy:
      # One shard's failure must not cancel the others: a red run should
      # report every broken suite, not just whichever tripped first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      # The M0 migration needs (a) the timescaledb extension AND
      # (b) Postgres 18's built-in `uuidv7()` for every table's
      # default. timescale/timescaledb-ha:pg18 has both (it tracks
      # what prod's DO Managed Postgres 18 + Timescale add-on
      # provides).
      postgres:
        # PINNED, by version AND digest.
        #
        # `pg18` is a FLOATING tag. On 2026-09-09 it was republished at
        # 16:35 UTC — TimescaleDB 2.29.2 → 2.30.0 — and CI went red six
        # minutes later on a commit that touched none of the affected
        # code: every hypertable query filtering on an enum started
        # failing with `cannot cast type cstring to
        # public.stock_movement_type`, taking out pack, cancel and the
        # whole stock-conservation suite. The run 21 minutes earlier, on
        # the same code, was green.
        #
        # This is the SECOND time this tag has done this to us — the
        # first was a ~14h red spell when the image stopped provisioning
        # a default `postgres` role. That one was worked around without
        # pinning, so it happened again.
        #
        # The digest is what makes it immutable: a version tag is
        # conventionally stable but is still a mutable pointer, and this
        # exact failure is what a mutable pointer buys.
        #
        # To move: pick the new tag, put its digest here, and run the
        # e2e suite BEFORE merging — the upgrade is then a deliberate
        # change with its own evidence, which is the whole point.
        image: timescale/timescaledb-ha:pg18.6-ts2.29.2@sha256:fd37d32e2431cd18c183a31053518593bab15db182132defafdd2395791a53c1
        env:
          POSTGRES_USER: skydrop
          POSTGRES_PASSWORD: skydrop
          POSTGRES_DB: skydrop_test
        options: >-
          --health-cmd "pg_isready -U skydrop -d skydrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
      RESEND_API_KEY: ''
      JWT_ACCESS_SECRET: ci-access-secret-not-prod
      JWT_REFRESH_SECRET: ci-refresh-secret-not-prod
      COURIER_CREDENTIALS_KEY_v1: ci-aes-gcm-32byte-key-padding-32x
      TRACKING_WEBHOOK_SECRET_DELHIVERY: ci-tracking-webhook
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      API_BASE_URL: http://localhost:4000
      DO_SPACES_ACCESS_KEY: ci-stub
      DO_SPACES_SECRET_KEY: ci-stub
      DO_SPACES_BUCKET: ci-stub
      DO_SPACES_REGION: sgp1
      DO_SPACES_ENDPOINT: https://sgp1.digitaloceanspaces.com
      # e2e MUST NOT touch live object storage. Without this the suite
      # builds a real S3 client and calls DigitalOcean with the stub
      # bucket above, so AWB label upload, the CSV error reports and the
      # catalog image test all depend on a third party being reachable
      # and answering the way they did last time. It cost a red run whose
      # failures (NoSuchBucket, and an AWB job that therefore never
      # confirmed its manifest) pointed at five unrelated subsystems.
      # The browser job has always set this; e2e was the gap.
      #
      # Note the DO_SPACES_* names above are read by NOTHING — the app
      # wants SPACES_ACCESS_KEY_ID / SPACES_SECRET_ACCESS_KEY — so they
      # never stood in for credentials either. Left in place rather than
      # deleted in the same change that fixes the red.
      DEV_MOCK_SPACES: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          # apps/api's ONLY workspace dependency. The three frontend
          # packages cost ~35s here and nothing in this job imports them.
          packages: db

      - name: Prisma migrate (test DB)
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy

      # Does the SCHEMA agree with the MIGRATIONS? `prisma validate` only
      # asks whether the schema is internally consistent, and a schema can
      # be perfectly consistent while describing columns no migration
      # creates — which is exactly what happened when a dangling relation
      # made `prisma format` invent an implicit FK on goods_receipts. The
      # client then expected a column the database did not have, and the
      # symptom was 80 e2e failures with a stack trace pointing at an
      # unrelated insert. This asks the question directly and names the
      # difference in one line.
      #
      # --exit-code: 0 = no difference, 2 = drift. It runs BEFORE the
      # suite so drift is reported as drift rather than as a test failure.
      - name: Schema matches migrations (no drift)
        # Once, not once per shard — it asks about the schema, which is
        # identical across them.
        if: matrix.shard == 1
        working-directory: packages/db
        # `migrate diff --from-migrations` REPLAYS every migration into the
        # shadow database, and it does not create that database itself —
        # a missing one is P1003, not a clean answer. The harness already
        # proves psql is on the runner (test-database.ts talks to it over
        # TCP), and POSTGRES_USER owns the cluster, so it may create one.
        run: |
          # skydrop_test, not `postgres`: this image has surprised us once
          # already by not provisioning a default `postgres` role, and
          # POSTGRES_DB is the one database we know exists.
          psql "postgresql://skydrop:skydrop@localhost:5432/skydrop_test" \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS skydrop_drift_check' \
            -c 'CREATE DATABASE skydrop_drift_check'
          set +e
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "postgresql://skydrop:skydrop@localhost:5432/skydrop_drift_check?schema=public" \
            --exit-code
          code=$?
          set -e
          # 0 = agree, 2 = real drift, anything else = the check itself
          # broke. Saying which costs five lines and saves reading a log
          # to find out whether the schema is wrong or the gate is.
          if [ "$code" = 2 ]; then
            echo "::error::Schema and migrations DISAGREE. The diff above is the missing migration."
            exit 1
          elif [ "$code" != 0 ]; then
            echo "::error::The drift check itself failed (exit $code) — this is not a schema problem."
            exit 1
          fi

      # TEST_DB_DOCKER_CONTAINER='' switches the harness from
      # `docker exec skydrop-postgres` (local dev) to a direct TCP psql
      # against the service container above.
      - name: E2E tests — API (jest, runInBand, shard ${{ matrix.shard }}/4)
        env:
          TEST_DB_DOCKER_CONTAINER: ''
        # --shard splits by test FILE, so a suite is never torn in half.
        #
        # NO `--` before the flag: pnpm forwards it literally, jest then
        # reads it as a positional and treats everything after as a
        # test-name PATTERN — "0 matches", exit 1, on a suite that is
        # perfectly fine. Verified locally with --listTests (10/10/9).
        run: pnpm --filter @skydrop/api test:e2e --shard=${{ matrix.shard }}/4

  # ── Build once, for the deploy to reuse ─────────────────────────────
  # CI already builds every app for the browser specs and throws it away;
  # the Deploy workflow then built the same thing again. This job builds
  # the affected apps and UPLOADS them, so Deploy downloads instead of
  # rebuilding — the last duplicated build in the pipeline.
  #
  # It runs on PRs too, not just push-to-main, because the browser shards
  # now consume this artifact. Measured 2026-10-28: a browser shard spent
  # 293 of its 453 seconds building the seven apps, and there are FOUR
  # shards — the same build, four times over, beside this job doing it a
  # fifth. The tests themselves took 42s.
  build:
    name: build artifacts
    needs: changes
    # ALWAYS on a push to main, even when nothing looks affected.
    #
    # Gating this on `changes` was false economy. c6df0243 was a
    # docs-only merge, so `build` skipped, so no artifact existed, so
    # Deploy's fallback rebuilt all seven apps — 279 SECONDS to deploy
    # nothing. Skipping a cached ~70s job cost four times what it saved,
    # and only because the saving and the cost sit in different
    # workflows where neither can see the other.
    #
    # On a PR it still follows `changes`: there is no deploy to feed, so
    # the artifact would be storage nobody collects.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          # One turbo invocation: it resolves ^build itself, so the
          # shared packages build once and the apps fan out in parallel.
          APPS="${{ needs.changes.outputs.apps }}"
          [ -n "$APPS" ] || APPS="admin seller track reseller associate marketing"
          FILTERS="--filter=@skydrop/api"
          for A in $APPS; do FILTERS="$FILTERS --filter=@skydrop/$A"; done
          echo "building: api $APPS"
          pnpm turbo run build $FILTERS --concurrency=100%

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APPS="${{ needs.changes.outputs.apps }}"
          [ -n "$APPS" ] || APPS="admin seller track reseller associate marketing"
          # Shared packages whole — 3.6 MB, and the alternative is an app
          # running against a sibling's older dist.
          tar -czf artifacts/packages.tgz packages/*/dist
          tar -czf artifacts/api.tgz -C apps/api/dist .
          for A in $APPS; do
            if [ "$A" = "marketing" ]; then
              tar -czf artifacts/marketing.tgz -C apps/marketing/out .
            else
              # --exclude=./cache: the incremental build cache is useless
              # to a box that never builds, and nearly all of the bytes.
              tar -czf "artifacts/$A.tgz" --exclude=./cache -C "apps/$A/.next" .
            fi
          done
          # Prove each archive BEFORE it is uploaded. Read the listing
          # once into a variable: `tar -tzf … | grep -q …` makes tar take
          # SIGPIPE, and under pipefail the check fails on a good
          # archive.
          for F in artifacts/*.tgz; do
            B="$(basename "$F" .tgz)"
            case "$B" in
              api)       NEED='./main.js' ;;
              packages)  NEED='' ;;
              marketing) NEED='./index.html' ;;
              *)         NEED='./BUILD_ID' ;;
            esac
            if [ -n "$NEED" ]; then
              # HERESTRING, not a pipe. `grep -q` exits at the first
              # match and closes its input; whatever was writing takes
              # SIGPIPE, and under `set -o pipefail` the pipeline reports
              # THAT — so the check fails on a perfectly good archive.
              #
              # Replacing `tar -tzf | grep -q` with `printf | grep -q`
              # did not fix it, because the pipe was never the writer's
              # fault: any producer feeding grep -q hits this. A
              # herestring has no pipe and no second process to fail.
              LISTING="$(tar -tzf "$F")"
              if ! grep -qx "$NEED" <<<"$LISTING"; then
                echo "!! $F has no $NEED"
                head -5 <<<"$LISTING"
                exit 1
              fi
            fi
            printf '  %-14s %s\n' "$B" "$(du -h "$F" | cut -f1)"
          done
          echo "total: $(du -ch artifacts/*.tgz | tail -1 | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: artifacts/
          retention-days: 3
          compression-level: 0

  # ── Browser specs ────────────────────────────────────────────────────
  # Its own job, not a step alongside the API e2e, for one concrete
  # reason: that suite's global teardown DROPS the test database, and
  # anything needing a live API afterwards would come up against nothing.
  #
  # These specs cover seams nothing else can: the FE-3 same-origin proxy,
  # the FE-4 SSR cookie gate, FE-2 server-verdict-verbatim, the nonce CSP,
  # and phone-width layout — all of which only exist in a real browser
  # talking to a real Next server. It is also, per the note at the top of
  # this file, where the Next apps get built and therefore where a broken
  # build is caught.
  browser:
    name: browser (${{ matrix.shard }}/4)
    # Waits for `build`, and that is a deliberate trade. Serially it is
    # build + shard; in parallel it was four shards each repeating the
    # build. On a cold cache the two are within seconds of each other; on
    # a warm one the build collapses and this wins outright — and it
    # stops burning four duplicate builds either way.
    needs: [changes, build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        # PINNED, by version AND digest.
        #
        # `pg18` is a FLOATING tag. On 2026-09-09 it was republished at
        # 16:35 UTC — TimescaleDB 2.29.2 → 2.30.0 — and CI went red six
        # minutes later on a commit that touched none of the affected
        # code: every hypertable query filtering on an enum started
        # failing with `cannot cast type cstring to
        # public.stock_movement_type`, taking out pack, cancel and the
        # whole stock-conservation suite. The run 21 minutes earlier, on
        # the same code, was green.
        #
        # This is the SECOND time this tag has done this to us — the
        # first was a ~14h red spell when the image stopped provisioning
        # a default `postgres` role. That one was worked around without
        # pinning, so it happened again.
        #
        # The digest is what makes it immutable: a version tag is
        # conventionally stable but is still a mutable pointer, and this
        # exact failure is what a mutable pointer buys.
        #
        # To move: pick the new tag, put its digest here, and run the
        # e2e suite BEFORE merging — the upgrade is then a deliberate
        # change with its own evidence, which is the whole point.
        image: timescale/timescaledb-ha:pg18.6-ts2.29.2@sha256:fd37d32e2431cd18c183a31053518593bab15db182132defafdd2395791a53c1
        env:
          POSTGRES_USER: skydrop
          POSTGRES_PASSWORD: skydrop
          POSTGRES_DB: skydrop_test
        options: >-
          --health-cmd "pg_isready -U skydrop -d skydrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    # Exactly what apps/api/src/config/env.schema.ts declares REQUIRED,
    # plus the proxy target. Deliberately NOT a copy of the other jobs'
    # env: that block carries several names the app never reads (the test
    # harness does), and copying it is how this job's first run failed —
    # JWT_ACCESS_SECRET is not JWT_SIGNING_KEY, so the boot died on a
    # missing variable that looked present.
    #
    # NODE_ENV and PORT are scoped to the API step instead of set here:
    # `next start` chooses its own, and a job-wide NODE_ENV=test would
    # reach frontends that were built for production.
    env:
      DATABASE_URL: postgresql://skydrop:skydrop@localhost:5432/skydrop_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      # min 32 chars, enforced by the schema.
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-prod-32-chars-min
      SELLER_APP_URL: http://localhost:3003
      ADMIN_APP_URL: http://localhost:3002
      # What the Next route-handler proxy forwards to (FE-3).
      API_ORIGIN: http://localhost:4000
      # Empty key = the NOTIF-6 dev stub; no mail leaves CI.
      RESEND_API_KEY: ''
      # No real object storage in CI.
      DEV_MOCK_SPACES: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: Prisma migrate + seed
        working-directory: packages/db
        # Seeded because the API reads system_settings on boot; the login
        # specs deliberately need no seeded USER (they assert on the
        # server's generic 401 for an unknown email).
        run: |
          pnpm exec prisma migrate deploy
          pnpm run seed

      # Next's incremental build cache. 165s of this job's ~300s was
      # rebuilding four apps from scratch every run, most of which had
      # not changed. Keyed on the lockfile plus the app sources, with a
      # restore-fallback so a source change still starts from the last
      # good cache rather than from nothing.
      #
      # ONLY .next/cache — never .next itself. The output directory
      # carries a build manifest tied to the commit that produced it, and
      # restoring a stale one gives you a server booting against a build
      # it did not make. The cache subdirectory is the part Next itself
      # documents as safe to carry between builds.
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/admin/.next/cache
            apps/seller/.next/cache
            apps/track/.next/cache
            apps/marketing/.next/cache
            apps/reseller/.next/cache
            apps/associate/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/*/src/**', 'packages/ui/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # DOWNLOAD what `build artifacts` already built, rather than
      # building it a fifth time.
      #
      # Measured 2026-10-28: this step was 293s of a 453s job, and it ran
      # in all four shards. The specs themselves were 42s. Every app's
      # build is still CHECKED — the `build` job builds all of them and
      # fails if any does — so RS-2 and ASSOC-1 keep the guarantee the
      # old comments here were protecting: an app left off that list is
      # an app whose build is verified nowhere.
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: /tmp/build

      - name: Put it where the servers expect it
        run: |
          set -euo pipefail
          # Mirrors scripts/deploy.sh: archives carry CONTENTS, so each
          # unpacks into the directory itself, not a nested copy.
          tar -xzf /tmp/build/packages.tgz -C .
          mkdir -p apps/api/dist && tar -xzf /tmp/build/api.tgz -C apps/api/dist
          for A in admin seller track reseller associate; do
            [ -f "/tmp/build/$A.tgz" ] || continue
            mkdir -p "apps/$A/.next"
            tar -xzf "/tmp/build/$A.tgz" -C "apps/$A/.next"
          done
          # Marketing is `output: 'export'`; its `start` serves out/ via
          # scripts/serve-static.mjs, so playwright's webServer needs the
          # directory present even though no spec imports from it.
          if [ -f /tmp/build/marketing.tgz ]; then
            mkdir -p apps/marketing/out
            tar -xzf /tmp/build/marketing.tgz -C apps/marketing/out
          fi
          echo "placed:"; ls -d apps/*/.next apps/*/out apps/api/dist 2>/dev/null | sed 's/^/  /'

      # Cache the browser binary. The download is ~120MB and identical
      # between runs; keyed on the lockfile so a Playwright bump busts it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        # NO `--with-deps`, and that is the fix rather than an omission.
        #
        # `--with-deps` runs apt, and apt against archive.ubuntu.com is
        # what hung this job for 20+ minutes twice and then burned the
        # 8-minute bound the previous attempt added. The bound worked —
        # it failed fast and named the step — but the cure for a slow
        # mirror is not to wait for it more politely.
        #
        # What that apt run actually did, read off the log: 26 packages
        # "already the newest version" (every library chromium links
        # against is in the runner image), and 9 NEW ones that are all
        # FONTS — CJK, Cyrillic, emoji glyph sets. No spec here renders a
        # non-Latin script: they visit /login, /dashboard, the marketing
        # page and the app roots, and each app ships its own committed
        # latin-subset woff2. So the only thing 21MB of archive was
        # buying us was glyphs nothing draws.
        #
        # If a spec ever does assert on Devanagari — apps/track has a
        # Hindi locale — install just that font here rather than bringing
        # the whole apt path back.
        timeout-minutes: 6
        run: |
          pnpm exec playwright install chromium \
            || { echo "::warning::playwright install failed once, retrying"; \
                 sleep 5; pnpm exec playwright install chromium; }

      - name: Start the API
        env:
          NODE_ENV: test
          PORT: 4000
        run: |
          pnpm --filter @skydrop/api start > /tmp/api.log 2>&1 &
          # Wait for readiness rather than sleeping — a fixed sleep is
          # either too short on a slow runner or wasted on a fast one.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/ready > /dev/null 2>&1; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready — last 80 log lines:"; tail -80 /tmp/api.log; exit 1

      - name: Browser specs
        # The admin + seller + track + marketing servers are auto-spawned
        # by playwright's webServer config (built output in CI, not
        # `dev`).
        #
        # --shard splits the spec list four ways. Playwright balances by
        # spec count, not by duration, so the shards are approximate —
        # good enough while the suite is ~13 minutes serial.
        #
        # PROJECT FILTERING: on an ordinary change only the frontends
        # that changed are exercised. On a FULL-GATE change — shared
        # packages, auth, money, couriers, migrations — `changes` names
        # every app, so the filter is the whole set and nothing is
        # skipped on exactly the changes these specs exist to catch.
        env:
          AFFECTED_APPS: ${{ needs.changes.outputs.apps }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${AFFECTED_APPS:-}" ]; then
            for A in $AFFECTED_APPS; do ARGS="$ARGS --project=$A"; done
            echo "browser projects: $AFFECTED_APPS"
          else
            echo "browser projects: all (no affected list)"
          fi
          # `pnpm exec playwright`, not `pnpm e2e:fe`: pnpm can claim a
          # leading --flag as its own rather than forwarding it, and a
          # swallowed --shard means four jobs each running the FULL suite
          # while the log still says "shard".
          # --pass-with-no-tests: with project filtering, a shard can
          # legitimately receive zero specs. Without this it exits
          # non-zero and reds a CI run in which nothing is wrong.
          pnpm exec playwright test --pass-with-no-tests --shard=${{ matrix.shard }}/4 $ARGS

      - name: API log on failure
        if: failure()
        run: tail -200 /tmp/api.log

      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
