packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Security overrides — transitive dependencies with published fixes that
# their parents have not picked up yet. Keyed per-major where the tree
# carries two, so a v1 consumer is not dragged onto v5.
#
# Reviewed 2026-07-27 against `pnpm audit`. Revisit when parents update:
# an override that outlives its need silently pins a package.
overrides:
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.0.2
  brace-expansion@5: ^5.0.8
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0
  fast-uri: ^3.1.4
  form-data: ^4.0.6
  postcss: ^8.5.18
  multer: ^2.2.0
